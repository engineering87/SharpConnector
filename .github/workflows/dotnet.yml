# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build
permissions:
  contents: read

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Commitlint dependencies
      run: npm install --no-save @commitlint/cli @commitlint/config-conventional

    - name: Lint commit messages
      if: github.event_name == 'pull_request'
      run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore src/SharpConnector/SharpConnector.sln

    - name: Build
      run: dotnet build src/SharpConnector/SharpConnector.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test src/SharpConnector.Tests/SharpConnector.Tests.csproj --no-build --configuration Release --verbosity normal
